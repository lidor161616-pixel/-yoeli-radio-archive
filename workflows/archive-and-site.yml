# ארכיון טלגרם + פרסום האתר – רץ על השרתים של GitHub, בלי שרת משלכם.
#  • כל שעה: מושך פרקים חדשים משני ערוצי הטלגרם, מעלה ל-R2 ומעדכן את data/episodes.json
#  • אחרי כל משיכה, ובכל שינוי בקבצים: מפרסם את האתר ב-GitHub Pages
name: ארכיון ואתר

on:
  schedule:
    - cron: "17 * * * *"      # כל שעה (בדקה 17)
  workflow_dispatch:          # כפתור "Run workflow" להרצה ידנית
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: telegram-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: התקנה
        run: pip install -r sync/requirements.txt

      - name: משיכת פרקים מטלגרם
        timeout-minutes: 335
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          CHANNELS: ${{ vars.CHANNELS }}
          AUDIO_BITRATE: ${{ vars.AUDIO_BITRATE }}
        run: python sync/telegram_archive.py

      - name: שמירת רשימת הארכיון
        if: always()
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add data/episodes.json data/sync-state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "אין פרקים חדשים"; exit 0; fi
          git commit -m "ארכיון: עדכון פרקים"
          git pull --rebase --autostash
          git push

  deploy:
    needs: sync
    if: always() && needs.sync.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
